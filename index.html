        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config Setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config)

                apiKey: "demo-key",
                authDomain: "demo-app.firebaseapp.com",
                projectId: "demo-app",
                storageBucket: "demo-app.appspot.com",

                appId: "1:123456789:web:demo"
              };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'police-batch-2022';

        // Global Firebase References for Window
        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.fbCollection = collection;
        window.fbDoc = doc;
        window.fbSetDoc = setDoc;
        window.fbAddDoc = addDoc;
        window.fbUpdateDoc = updateDoc;
        window.fbDeleteDoc = deleteDoc;
        window.fbOnSnapshot = onSnapshot;

        // Authenticate User
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                // Start listening to real-time Cloud Firestore Data
                listenToCloudData();
            } catch (err) {
                console.error("Auth / Cloud Connection Error:", err);
                showToast("ক্লাউড কানেকশন তৈরিতে সমস্যা হয়েছে! ব্যাকআপ ডাটা দেখানো হচ্ছে।", true);
            }
        }

        // Listen for Realtime Cloud Updates
        function listenToCloudData() {
            // Strict Path Compliance: /artifacts/{appId}/public/data/members
            const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
            
            onSnapshot(membersRef, (snapshot) => {
                const cloudMembers = [];
                snapshot.forEach((docSnap) => {
                    cloudMembers.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (cloudMembers.length === 0 && !window.initialSeedDone) {
                    // Seed initial data to cloud if empty
                    seedInitialCloudData();
                } else {
                    window.allMembersData = cloudMembers;
                    renderMembersGrid();
                }
            }, (error) => {
                console.error("Firestore Listen Error:", error);
            });
        }

        async function seedInitialCloudData() {
            window.initialSeedDone = true;
            const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
            for (const item of initialMembersList) {
                const docRef = doc(membersRef, item.id);
                await setDoc(docRef, item);
            }
        }

        window.initAuth = initAuth;
    </script>

        // Save Member to Cloud Firestore
        async function saveMember(e) {
            e.preventDefault();
            if (currentUserRole !== 'admin') {
                showToast('শুধুমাত্র অ্যাডমিন নতুন সদস্য সংরক্ষণ করতে পারবেন', true);

            const id = document.getElementById('editMemberId').value;
            const name = document.getElementById('memberName').value;
            const bp = document.getElementById('memberBp').value;
            const rank = document.getElementById('memberRank').value;
            const unit = document.getElementById('memberUnit').value;
            const branch = document.getElementById('memberBranch').value;
            const blood = document.getElementById('memberBlood').value;
            const location = document.getElementById('memberLocation').value;
            const phone = document.getElementById('memberPhone').value;

            const memberObj = {
                name, bp, rank, unit, branch, blood, location, phone,
                photo: memberImageBase64 || ''
            };

            try {
                // Cloud Firestore Path: /artifacts/{appId}/public/data/members
                const membersCol = window.fbCollection(window.db, 'artifacts', window.appId, 'public', 'data', 'members');

                if (id) {
                    // Update Cloud Doc
                    const docRef = window.fbDoc(membersCol, id);
                    await window.fbSetDoc(docRef, memberObj, { merge: true });
                    showToast('ক্লাউড স্টোরেজে তথ্য সফলভাবে আপডেট হয়েছে!');
                } else {
                    // Add New Cloud Doc
                    const newId = Date.now().toString();
                    const docRef = window.fbDoc(membersCol, newId);
                    await window.fbSetDoc(docRef, { id: newId, ...memberObj });
                    showToast('ক্লাউড স্টোরেজে নতুন সদস্য সংরক্ষণ করা হয়েছে!');
                }
                closeModal('memberFormModal');
            } catch (err) {
                console.error("Cloud Save Error:", err);
                showToast('ক্লাউডে তথ্য সংরক্ষণ করতে ব্যর্থ হয়েছে!', true);
            }
        }

        // Edit Member
        function editMember(id) {
            const member = (window.allMembersData || []).find(m => m.id === id);
            if (!member) return;

            document.getElementById('editMemberId').value = member.id;
            document.getElementById('memberName').value = member.name || '';
            document.getElementById('memberBp').value = member.bp || '';
            document.getElementById('memberRank').value = member.rank || 'কনস্টেবল';
            document.getElementById('memberUnit').value = member.unit || 'পুলিশ হেডকোয়ার্টার্স';
            document.getElementById('memberBranch').value = member.branch || 'প্রশাসনিক শাখা';
            document.getElementById('memberBlood').value = member.blood || 'A+';
            document.getElementById('memberLocation').value = member.location || '';
            document.getElementById('memberPhone').value = member.phone || '';

            memberImageBase64 = member.photo || '';
            if (member.photo) {
                document.getElementById('photoPreviewBox').innerHTML = `<img src="${member.photo}" class="w-full h-full object-cover">`;
            } else {
                document.getElementById('photoPreviewBox').innerHTML = `<i class="fa-solid fa-user text-2xl text-gray-500"></i>`;
            }

            document.getElementById('formTitle').innerText = 'সদস্যের তথ্য সম্পাদনা করুন (Cloud Sync)';
            openModal('memberFormModal');
        }

        // Delete Member from Cloud Firestore
        async function deleteMember(id) {
            if (confirm('আপনি কি নিশ্চিত যে এই সদস্যকে ক্লাউড ডাটাবেজ থেকে মুছে ফেলতে চান?')) {
                try {
                    const docRef = window.fbDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', id);
                    await window.fbDeleteDoc(docRef);
                    showToast('ক্লাউড ডাটাবেজ থেকে মুছে ফেলা হয়েছে');
                } catch (err) {
                    console.error("Delete Error:", err);
                    showToast('ক্লাউড থেকে ডিলিট করতে সমস্যা হয়েছে!', true);
                }
            }
        }

        // Export Data Backup
        function exportData() {
            const members = window.allMembersData || [];
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Police_Batch_2022_CloudBackup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('ডাটা ব্যাকআপ ফাইল ডাউনলোড হয়েছে');
        }

        // Import Data Restore to Cloud
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedList = JSON.parse(e.target.result);
                    if (Array.isArray(importedList)) {
                        const membersCol = window.fbCollection(window.db, 'artifacts', window.appId, 'public', 'data', 'members');
                        for (const item of importedList) {
                            const docId = item.id || Date.now().toString() + Math.random().toString(36).substr(2, 4);
                            const docRef = window.fbDoc(membersCol, docId);
                            await window.fbSetDoc(docRef, { ...item, id: docId });
                        }
                        showToast('ক্লাউড স্টোরেজে সফলভাবে তথ্য রিস্টোর করা হয়েছে!');
                    } else {
                        showToast('অবৈধ ফাইল ফরম্যাট!', true);
                    }
                } catch (err) {
                    showToast('ফাইল পড়তে ব্যর্থ হয়েছে!', true);
                }
            };
            reader.readAsText(file);
        }

        // Helper Utility: Toast Notification
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = msg;
            if (isError) {
                toast.classList.remove('border-police-accent');
                toast.classList.add('border-red-600');
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-500 text-xl";
            } else {
                toast.classList.remove('border-red-600');
                toast.classList.add('border-police-accent');
                toastIcon.className = "fa-solid fa-circle-check text-police-accent text-xl";
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Convert Numbers to Bangla Digits
        function toBanglaDigit(num) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, d => banglaDigits[d]);
        }
    </script>
</body>
</html>
